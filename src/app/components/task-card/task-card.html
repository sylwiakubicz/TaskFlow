<article class="task-card">
  <h3>{{ task().title }}</h3>

  @if (task().status === 'done') {
  <p>Completed</p>
  } @else {
  <p>To do</p>
  }

  <button type="button" (click)="toggleCompleted()">
    {{ task().status === 'done' ? 'Undo' : 'Complete' }}
  </button>

  <button type="button" (click)="requestDelete()">
    Delete
  </button>
</article>
